name: Public library checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify mod implementation stays excluded
        run: |
          test -z "$(git ls-files client deploy tools third_party build.ps1 .gitmodules)"
          test -z "$(git ls-files research/ssmp-dl-adapter/source research/ssmp-dl-adapter/baseline/port research/ssmp-dl-adapter/optional-untested)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify defined tool source and inventory
        run: python tooling/check_inventory.py
      - name: Install synthetic example dependencies
        run: python -m pip install -r tooling/requirements.txt
      - name: Run synthetic examples
        run: |
          python valkyrie.py demo valkyrie-collision
          python valkyrie.py demo valkyrie-content
          python valkyrie.py demo valkyrie-signal
      - name: Verify bounded appearance edits and hair palettes
        run: |
          python -m unittest discover -s tooling/source/workshop/tools/model-conversion/tests -p test_rw_texture_names.py
          python -m unittest discover -s tooling/source/workshop/tools/model-conversion/tests -p test_hair_colors.py
      - name: Verify scalar animation decoding and native ANP3 clocks
        run: python -m unittest discover -s tooling/source/workshop/tools/model-conversion/tests -p test_animation_conversion.py
      - name: Verify evaluated matrix streams and retimed endpoints
        run: python -m unittest discover -s tooling/source/workshop/tools/model-conversion/tests -p test_runtime_pose_stream.py
      - name: Verify generated research evidence
        run: sha256sum -c docs/reverse-engineering/SHA256SUMS
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b
        with:
          config: .markdownlint-cli2.jsonc
